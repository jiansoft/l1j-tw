#
# L1J Server 啟動設定檔 (Java 8+)
#

# 使用 Server 模式, 具有較好的記憶體控制效能
-server

# 時區設置, 避免 JVM 抓取到錯誤的時區
-Duser.timezone=Asia/Taipei

# 伺服器最大及最小記憶體使用量, 建議設定為相同
-Xmx1024m
-Xms1024m

# 每個執行緒初始使用的記憶體大小
-Xss256k

# Metaspace 設定 (Java 8+ 取代 PermGen)
-XX:MetaspaceSize=128m
-XX:MaxMetaspaceSize=256m

# 使用 G1 垃圾收集器 (Java 9+ 推薦, 適合大部分應用)
-XX:+UseG1GC

# G1 GC 調優參數
-XX:MaxGCPauseMillis=200
-XX:G1HeapRegionSize=4m
-XX:InitiatingHeapOccupancyPercent=45

# 停用顯式 GC 呼叫
-XX:+DisableExplicitGC

# GC 日誌輸出 (Java 9+ 新格式)
-Xlog:gc*:file=log/gc.log:time,uptime,level,tags:filecount=5,filesize=10M
